schema: spec-driven

context: |
  Language: ja
  All artifacts must be written in ja.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## プロジェクト概要
  QUILL は、Gmail と Slack の通知を見張り、人の確認が必要なものだけを ToDo として積むデスクトップ常駐エージェント。
  画面の隅に秘書鳥「クイル」が常駐し、エージェントの状態（idle / fetching / triaging / todo / unsure / error）を表情で知らせる。
  - 利用者は作者1人。配布物は作らず、リポジトリからスクリプトで起動する
  - Mac と Windows の両方で動くこと
  - 読み取り専用。返信・投稿・ラベル変更などの書き込みは、承認された変更提案があるまで実装しない
  - 取得元は Gmail と Slack。まず Gmail から実装し、Slack は後から足す。仕分けルールは取得元ごとに分ける

  ## アーキテクチャ
  Electron main プロセスがオーケストレーター。一定間隔（初期値30分）で次を行う。
  ① 取得：取得元ごとの MessageSource。claude -p（Haiku）を stream-json で動かし、読み取りツールだけを許可する。
     メッセージはモデルの最終出力ではなく、ツールの返り値（tool_result）をコードでパースして得る。時刻の絞り込みもコードで行う。
  ② 受信箱：SQLite（better-sqlite3）に保存。(source, external_id) で一意。カーソルは取得元ごとに持つ。新着がなければ③を呼ばない。
  ③ 仕分け：claude -p（ツールなし）。取得元ごとのルールファイルと新着だけを渡し、todo / ignore / unsure を JSON で返させる。
  ④ 出力：todos テーブルに積み、renderer のクイルと一覧に反映する。

  ## 原則
  1. 決定的にできることはコードでやる（スケジュール、カーソル、重複除外、保存、件数上限）。Claude は「読む手（①）」と「判断（③）」だけ
  2. Claude の呼び出しは最小限。呼び出し回数・所要時間・トークンはログに残す
  3. 狼少年にしない。迷うものは unsure に分ける
  4. Claude の出力は信用しすぎない。JSON とツールの返り値は zod でスキーマ検証し、失敗したらエラー状態にして記録する
  5. 状態は会話に持たせず、SQLite とルールファイルに置く

  ## 技術スタック
  Electron + TypeScript（contextIsolation: true、nodeIntegration: false）、better-sqlite3、zod、Vitest、pnpm。

  ## セキュリティ
  - メッセージ本文はリポジトリに保存しない。DB・ログは app.getPath('userData') 配下
  - ログに本文を出さない（件数、ID、所要時間、呼び出し回数、トークンのみ）
  - claude -p の許可ツールは --allowedTools のホワイトリストで指定し、書き込み系は --disallowedTools でも塞ぐ
  - claude -p には必ず --no-session-persistence を付ける。--dangerously-skip-permissions は使わない

  ## マルチ OS
  パスは path / os / app.getPath() で組み立てる。claude CLI の起動処理は1か所にまとめる（Windows では claude.cmd）。
  シェル固有の構文に依存しない。スケジュールはアプリ内のタイマーで行う。

rules:
  proposal:
    - 変更要求（何を変えたいか）と仕様（どう振る舞うべきか）を分けて書く
    - 範囲外（やらないこと）を明記する
    - 1つの変更提案は1〜2日で終わる大きさにする
  specs:
    - Scenario は WHEN / THEN の形で書く
    - 推測で仕様を足さない。決まっていない点は design.md の未決事項に書く
  design:
    - 既存コードを変更する場合は「変更前の振る舞い」と「影響箇所」を書く（XDDP のスペックアウト）
    - Claude CLI の呼び出しは差し替え可能な境界（ClaudeRunner のようなインターフェース）にする
  tasks:
    - 各タスクは「Scenario X の失敗するテストを書く → 最小の実装で通す → リファクタ」の順にする
    - 各タスクに、対応する Requirement / Scenario と、変更する予定のファイル・関数を書く（トレーサビリティ）
    - 単体テストでは本物の Claude CLI を呼ばない
    - テスト名に Scenario 名を含める
